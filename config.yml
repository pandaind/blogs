# Site configuration for Meteorite (https://github.com/pandaind/meteorite).
title: PandaC
base_url: https://pandac.in/
language: en
theme: devlog

params:
  handle: pandac
  tagline: Full-stack developer. Java, Rust, AI and cloud.
  email: connect@pandac.in
  favicon: img/favico/favicon.ico
  color_scheme: auto
  skin: slate
  skin_switcher: true

menus:
  main:
    - { name: Work, url: /projects/, weight: 1 }
    - { name: Writing, url: /blog/, weight: 2 }
    - { name: Notes, url: /notes/, weight: 3 }
    - { name: Resume, url: /resume/, weight: 4 }

taxonomies: [tags]
paginate_by: 10

feed:
  enabled: true

search:
  enabled: true

markdown:
  highlight: true
  highlight_theme: InspiredGitHub
  highlight_theme_dark: base16-ocean.dark

build:
  drafts: false
  minify: true

# The chat widget replaces the old hand-written popup chat. It loads when the visitor clicks the
# button, and talks to the PopTalk backend.
chat:
  provider: poptalk
  api_url: https://api.pandac.logic.ist
  welcome: Ask me about my posts, projects or work
