# Builds the site with Meteorite (https://github.com/pandaind/meteorite) and deploys it to GitHub Pages.
name: Deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METEORITE_VERSION: 0.5.2
    steps:
      - name: Install Meteorite
        run: |
          name="meteorite-v${METEORITE_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/pandaind/meteorite/releases/download/v${METEORITE_VERSION}/${name}.tar.gz" | tar xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Check links and front matter
        run: meteorite check
      - name: Build
        run: meteorite build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

  cleanup:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Run custom script
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        ENVIRONMENT_NAME: "github-pages"
      run: |
        chmod +x .github/workflows/cleanup.sh
        ./.github/workflows/cleanup.sh
